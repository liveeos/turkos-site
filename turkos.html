<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>TürkOS — Bilge Sürüm 4.2.0</title>
<style>
:root{--tb:56px;--accent:#e30a17;--accent2:#ff5c6c;--glass:rgba(255,255,255,.78);--gb:rgba(255,255,255,.55);--dark:rgba(18,18,26,.78);--txt:#171722;--txt2:#5b6472;--shadow:0 24px 70px rgba(0,0,0,.35)}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{height:100vh;height:100dvh;width:100vw;overflow:hidden;font-family:"Segoe UI",system-ui,-apple-system,sans-serif;color:var(--txt);background:#0d0d14;user-select:none}
input,textarea{user-select:text}
button{font-family:inherit}
#bg{position:fixed;inset:0;z-index:0;background:linear-gradient(135deg,#7a0410,#e30a17 40%,#ff6b6b 70%,#3a0d16);background-size:400% 400%;animation:bgmove 24s ease infinite}
#bg:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 22% 28%,rgba(255,255,255,.22),transparent 45%),radial-gradient(circle at 78% 72%,rgba(255,220,180,.18),transparent 45%)}
#bg:after{content:"";position:absolute;inset:0;opacity:.35;background-image:radial-gradient(1px 1px at 12% 22%,#fff,transparent),radial-gradient(1px 1px at 34% 66%,#fff,transparent),radial-gradient(2px 2px at 58% 18%,#fff,transparent),radial-gradient(1px 1px at 76% 82%,#fff,transparent),radial-gradient(1px 1px at 90% 38%,#fff,transparent);animation:tw 5s ease-in-out infinite alternate}
@keyframes bgmove{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
@keyframes tw{from{opacity:.2}to{opacity:.6}}
#boot{position:fixed;inset:0;z-index:99999;background:#0b0b12;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;transition:opacity .7s}
#boot.off{opacity:0;pointer-events:none}
.crescent{width:96px;height:96px;border-radius:50%;background:var(--accent);position:relative;box-shadow:0 0 60px rgba(227,10,23,.6);animation:pulse 2s ease-in-out infinite}
.crescent:after{content:"";position:absolute;width:76px;height:76px;border-radius:50%;background:#0b0b12;top:10px;left:26px}
.crescent:before{content:"★";position:absolute;color:var(--accent);font-size:34px;right:-30px;top:30px;z-index:2}
@keyframes pulse{50%{filter:brightness(1.35)}}
.bootname{color:#fff;font-size:34px;font-weight:300;letter-spacing:10px}
.bootsub{color:rgba(255,255,255,.5);font-size:12px;letter-spacing:3px}
.bar{width:220px;height:3px;background:rgba(255,255,255,.12);border-radius:3px;overflow:hidden;position:relative}
.bar:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,var(--accent),#fff);animation:load 1.6s ease-in-out infinite}
@keyframes load{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
#desktop{position:absolute;inset:0 0 var(--tb) 0;z-index:1;padding:18px;display:flex;flex-direction:column;flex-wrap:wrap;align-content:flex-start;gap:8px}
.di{width:94px;height:96px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:#fff;border-radius:12px;cursor:pointer;transition:.18s;text-align:center}
.di:hover{background:rgba(255,255,255,.14);backdrop-filter:blur(8px);transform:translateY(-3px)}
.di .ic{font-size:36px;filter:drop-shadow(0 4px 8px rgba(0,0,0,.45))}
.di .lb{font-size:11.5px;font-weight:600;text-shadow:0 2px 6px rgba(0,0,0,.85);line-height:1.2}
.widget{position:absolute;right:18px;top:18px;width:270px;background:var(--dark);backdrop-filter:blur(22px);border:1px solid rgba(255,255,255,.14);border-radius:18px;padding:18px;color:#fff;z-index:1;box-shadow:0 12px 40px rgba(0,0,0,.35)}
.wtime{font-size:44px;font-weight:200;letter-spacing:2px}
.wdate{font-size:13px;opacity:.7;text-transform:capitalize}
.wdiv{height:1px;background:rgba(255,255,255,.12);margin:12px 0}
.wrow{display:flex;justify-content:space-between;font-size:12.5px;margin-top:6px}
.wrow .l{opacity:.6}
.wquote{font-size:11.5px;opacity:.75;font-style:italic;line-height:1.5;margin-top:10px}
.win{position:absolute;background:var(--glass);backdrop-filter:blur(26px) saturate(180%);border-radius:14px;box-shadow:var(--shadow),0 0 0 1px var(--gb);display:flex;flex-direction:column;overflow:hidden;min-width:min(300px,calc(100vw - 16px));max-width:calc(100vw - 16px);min-height:min(200px,calc(100dvh - var(--tb) - 16px));animation:wo .28s cubic-bezier(.16,1,.3,1)}
@keyframes wo{from{opacity:0;transform:scale(.92) translateY(16px)}}
.win.closing{animation:wc .18s ease-in forwards}
@keyframes wc{to{opacity:0;transform:scale(.94)}}
.win.min{display:none}
.win.max{left:0!important;top:0!important;width:100vw!important;height:calc(100dvh - var(--tb))!important;border-radius:0}
.wh{height:42px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;background:rgba(255,255,255,.45);border-bottom:1px solid rgba(0,0,0,.06);cursor:grab;flex:0 0 auto}
.wh:active{cursor:grabbing}
.wt{font-size:13px;font-weight:700;display:flex;gap:8px;align-items:center;pointer-events:none}
.wc{display:flex;gap:8px}
.cb{width:14px;height:14px;border-radius:50%;border:none;cursor:pointer;color:transparent;font-size:9px;line-height:1;display:flex;align-items:center;justify-content:center;transition:.15s}
.cb:hover{transform:scale(1.18);color:rgba(0,0,0,.65)}
.min{background:#ffbd2e}.max{background:#28c940}.cls{background:#ff5f57}
.wb{flex:1;overflow:auto;position:relative;background:rgba(255,255,255,.32)}
.rz{position:absolute;right:0;bottom:0;width:18px;height:18px;cursor:nwse-resize;z-index:5}
.win.max .rz{display:none}
.pad{padding:20px}
.h1{font-size:19px;font-weight:700;margin-bottom:4px}
.h2{font-size:14px;font-weight:700;margin:16px 0 10px;display:flex;gap:8px;align-items:center}
.sub{font-size:12.5px;color:var(--txt2)}
.btn{padding:9px 16px;border:none;border-radius:10px;cursor:pointer;font-weight:600;font-size:13px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 6px 16px rgba(227,10,23,.3);transition:.15s}
.btn:hover{transform:translateY(-2px)}
.btn.ghost{background:rgba(0,0,0,.06);color:var(--txt);box-shadow:none}
.btn.ghost:hover{background:rgba(0,0,0,.12)}
select,input[type=text],input[type=number]{padding:9px 12px;border-radius:10px;border:1px solid rgba(0,0,0,.12);background:rgba(255,255,255,.85);outline:none;font-size:13px;color:var(--txt)}
.card{background:rgba(255,255,255,.6);border:1px solid rgba(0,0,0,.06);border-radius:12px;padding:14px}
.grid{display:grid;gap:12px}
.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}
.tile{background:rgba(255,255,255,.65);border-radius:14px;padding:14px 8px;text-align:center;cursor:pointer;transition:.18s;border:1px solid rgba(0,0,0,.05)}
.tile:hover{transform:translateY(-3px);box-shadow:0 10px 22px rgba(0,0,0,.14);background:#fff}
.tile .ti{font-size:30px}.tile .tn{font-size:11.5px;font-weight:600;margin-top:6px}
.chip{padding:7px 13px;border-radius:20px;background:rgba(0,0,0,.06);font-size:12.5px;cursor:pointer;font-weight:600;border:1px solid transparent}
.chip:hover{background:rgba(227,10,23,.12)}
.chip.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.gm{display:flex;flex-direction:column;align-items:center;gap:12px;padding:16px;min-height:100%;background:linear-gradient(160deg,#2a0a10,#4a1220,#1b1b2b);color:#fff}
.gm-top{display:flex;gap:10px;justify-content:space-between;width:100%;max-width:420px;font-size:13px;font-weight:700}
.pill{background:rgba(255,255,255,.12);padding:7px 14px;border-radius:10px;backdrop-filter:blur(8px)}
.gm canvas{border-radius:12px;background:rgba(0,0,0,.35);box-shadow:0 10px 30px rgba(0,0,0,.4),inset 0 0 0 1px rgba(255,255,255,.08);touch-action:none}
.hint{font-size:11.5px;opacity:.7;text-align:center;line-height:1.5}
.qopt{display:block;width:100%;text-align:left;padding:12px 14px;margin-bottom:8px;border-radius:12px;border:1px solid rgba(0,0,0,.1);background:rgba(255,255,255,.75);cursor:pointer;font-size:13.5px;font-weight:600;transition:.15s}
.qopt:hover{background:#fff;transform:translateX(3px)}
.qopt.ok{background:#d1fae5;border-color:#10b981}
.qopt.no{background:#fee2e2;border-color:#ef4444}
.timer{height:6px;background:rgba(0,0,0,.08);border-radius:6px;overflow:hidden;margin-bottom:14px}
.timer i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width 1s linear}
.pink{background:linear-gradient(160deg,#ffe4f0,#fdf2f8,#ede9fe);min-height:100%;padding:16px}
.stage{background:linear-gradient(180deg,#fce7f3,#fbcfe8);border-radius:16px;height:260px;display:flex;align-items:flex-end;justify-content:center;position:relative;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(0,0,0,.05)}
.doll{position:relative;width:130px;height:230px}
.hair-b{position:absolute;left:15px;top:6px;width:100px;height:110px;border-radius:50px 50px 30px 30px}
.head{position:absolute;left:35px;top:22px;width:60px;height:66px;border-radius:32px;z-index:2}
.eye{position:absolute;top:30px;width:7px;height:9px;background:#2b2b3a;border-radius:50%;z-index:3}
.mouth{position:absolute;top:46px;left:26px;width:14px;height:7px;border-bottom:2px solid #d6336c;border-radius:0 0 12px 12px;z-index:3}
.dress{position:absolute;left:20px;top:84px;width:90px;height:110px;clip-path:polygon(30% 0,70% 0,100% 100%,0 100%);z-index:1}
.leg{position:absolute;top:190px;width:12px;height:32px;z-index:0}
.shoe{position:absolute;top:218px;width:22px;height:12px;border-radius:6px}
.acc{position:absolute;font-size:26px;z-index:4}
.nail{width:44px;height:60px;border-radius:22px 22px 12px 12px;cursor:pointer;box-shadow:inset 0 -6px 12px rgba(0,0,0,.12),0 3px 8px rgba(0,0,0,.15);display:flex;align-items:center;justify-content:center;font-size:16px;transition:.15s}
.nail:hover{transform:translateY(-4px)}
.sw{width:30px;height:30px;border-radius:50%;cursor:pointer;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.sw:hover{transform:scale(1.15)}
.plot{background:linear-gradient(180deg,#a7f3d0,#6ee7b7);border-radius:14px;height:100px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;font-size:30px;border:2px solid rgba(255,255,255,.6)}
.plot small{font-size:10px;font-weight:700;color:#065f46}
#taskbar{position:fixed;bottom:0;left:0;width:100%;height:var(--tb);background:var(--dark);backdrop-filter:blur(30px) saturate(180%);border-top:1px solid rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;z-index:9999}
.tbc{display:flex;gap:6px;align-items:center;background:rgba(255,255,255,.06);padding:6px;border-radius:14px}
#startbtn{width:42px;height:42px;border:none;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-size:20px;cursor:pointer;box-shadow:0 6px 16px rgba(227,10,23,.45)}
#startbtn:hover{transform:scale(1.06)}
#tbapps{display:flex;gap:6px}
.tba{width:42px;height:42px;display:flex;align-items:center;justify-content:center;font-size:20px;border-radius:10px;cursor:pointer;background:rgba(255,255,255,.06);position:relative;transition:.15s}
.tba:hover{background:rgba(255,255,255,.16);transform:translateY(-2px)}
.tba.on:after{content:"";position:absolute;bottom:-3px;width:20px;height:3px;border-radius:3px;background:linear-gradient(90deg,var(--accent),#fff)}
#tray{position:absolute;right:18px;display:flex;gap:12px;align-items:center;color:#fff;font-size:12px}
#clock{text-align:right;line-height:1.3;padding:4px 10px;border-radius:8px;cursor:pointer}
#clock:hover{background:rgba(255,255,255,.1)}
#start{position:fixed;bottom:70px;left:50%;transform:translateX(-50%) translateY(16px);width:min(640px,94vw);max-height:74vh;overflow:auto;background:var(--dark);backdrop-filter:blur(30px);border:1px solid rgba(255,255,255,.12);border-radius:20px;padding:22px;color:#fff;z-index:10000;display:none;opacity:0;transition:.28s cubic-bezier(.16,1,.3,1);box-shadow:0 24px 70px rgba(0,0,0,.55)}
#start.on{display:block;opacity:1;transform:translateX(-50%) translateY(0)}
.st-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.st-name{font-size:17px;font-weight:300;letter-spacing:4px}
#search{width:100%;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);color:#fff;margin-bottom:14px}
#search::placeholder{color:rgba(255,255,255,.5)}
.st-tabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.tab{padding:7px 14px;border-radius:20px;background:rgba(255,255,255,.08);font-size:12.5px;cursor:pointer;font-weight:600}
.tab.on{background:linear-gradient(135deg,var(--accent),var(--accent2))}
.st-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.si{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 6px;border-radius:14px;cursor:pointer;background:rgba(255,255,255,.04);transition:.15s;text-align:center}
.si:hover{background:rgba(255,255,255,.14);transform:translateY(-3px)}
.si .i{font-size:28px}.si .t{font-size:11px;font-weight:600;line-height:1.2}
#ctx{position:fixed;display:none;min-width:210px;background:var(--glass);backdrop-filter:blur(20px);border:1px solid var(--gb);border-radius:12px;padding:6px;z-index:99999;box-shadow:0 12px 40px rgba(0,0,0,.3)}
.ci{padding:10px 14px;font-size:13px;border-radius:8px;cursor:pointer;display:flex;gap:10px}
.ci:hover{background:rgba(227,10,23,.12)}
.cd{height:1px;background:rgba(0,0,0,.08);margin:4px 0}
#toasts{position:fixed;right:18px;bottom:74px;display:flex;flex-direction:column;gap:10px;z-index:99998}
.toast{display:flex;gap:12px;align-items:center;min-width:270px;padding:13px 18px;border-radius:14px;background:var(--dark);backdrop-filter:blur(20px);color:#fff;border:1px solid rgba(255,255,255,.12);box-shadow:0 10px 34px rgba(0,0,0,.4);animation:tin .3s cubic-bezier(.16,1,.3,1)}
.toast.out{animation:tout .3s forwards}
@keyframes tin{from{opacity:0;transform:translateX(90px)}}
@keyframes tout{to{opacity:0;transform:translateX(90px)}}
.toast .ti{font-size:22px}.toast b{font-size:13px}.toast p{font-size:11.5px;opacity:.8}
@media(max-width:760px){.widget{display:none}.st-grid{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(2,1fr)}.win{max-width:calc(100vw - 16px)}.gm canvas{max-width:100%;height:auto}}
@media(max-width:520px){#taskbar{justify-content:flex-start;padding:0 8px}.tbc{gap:3px;padding:4px;max-width:55vw;overflow:hidden}.tba{width:34px;height:34px;font-size:17px}#tbapps{max-width:27vw;overflow:hidden}#tbapps .tba:nth-child(n+4){display:none}#startbtn{width:36px;height:36px}#tray{right:7px;gap:6px;font-size:10px}#clock{padding:4px 5px}.wh{padding:0 10px}.wc{gap:6px}.cb{width:13px;height:13px}.pad{padding:14px}.g3{grid-template-columns:repeat(2,1fr)}.widget{display:none}}
</style>
</head>
<body>
<div id="boot"><div class="crescent"></div><div class="bootname">TÜRKOS</div><div class="bar"></div><div class="bootsub">BİLGE SÜRÜM · EĞİTİM SİSTEMİ</div></div>
<div id="bg"></div>
<div id="desktop"></div>

  <div class="wtime" id="wtime">00:00</div>
  <div class="wdate" id="wdate">—</div>

  <div class="wrow"><span class="l">👤 Kullanıcı</span><span id="wuser">Öğrenci</span></div>

<script>
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const rnd=n=>Math.floor(Math.random()*n), pick=a=>a[rnd(a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
const __tosMemoryStore=new Map();
const store={
  get:(k,d)=>{try{const v=window.localStorage.getItem('tos_'+k);return v===null?(__tosMemoryStore.has(k)?__tosMemoryStore.get(k):d):v}catch(e){return __tosMemoryStore.has(k)?__tosMemoryStore.get(k):d}},
  set:(k,v)=>{const value=String(v);__tosMemoryStore.set(k,value);try{window.localStorage.setItem('tos_'+k,value)}catch(e){/* Depolama engelliyse bu oturumda bellekte sakla. */}},
  clear:()=>{__tosMemoryStore.clear();try{const keys=[];for(let i=0;i<window.localStorage.length;i++){const key=window.localStorage.key(i);if(key&&key.startsWith('tos_'))keys.push(key)}keys.forEach(key=>window.localStorage.removeItem(key))}catch(e){/* Depolama erişimi zorunlu değil. */}}
};
const APP_VERSION='4.2.0';
let __tosLatestRelease=null;
function __tosCompareVersions(a,b){const aa=String(a||'0').split('.').map(x=>parseInt(x,10)||0),bb=String(b||'0').split('.').map(x=>parseInt(x,10)||0);for(let i=0;i<Math.max(aa.length,bb.length);i++){const d=(aa[i]||0)-(bb[i]||0);if(d)return d}return 0}
async function checkForUpdates(silent=false,statusNode=null){
  const setStatus=(msg)=>{if(statusNode)statusNode.textContent=msg};
  const baseUrl=document.baseURI||location.href;
  let baseProtocol='';
  try{baseProtocol=new URL(baseUrl).protocol}catch(e){}
  if(baseProtocol==='file:' || baseProtocol==='blob:'){
    setStatus('Otomatik kontrol, TürkOS internet sitesinde açıldığında kullanılabilir.');
    if(!silent)toast('ℹ️','Güncelleme kontrolü','Otomatik kontrol için TürkOS sitesini internetten aç.');
    return {available:false,offline:true};
  }
  try{
    const response=await fetch(new URL('./version.json',baseUrl).href,{cache:'no-store'});
    if(!response.ok)throw new Error('Sürüm bilgisi alınamadı');
    const release=await response.json();
    __tosLatestRelease=release;
    if(__tosCompareVersions(release.version,APP_VERSION)>0){
      setStatus('Yeni sürüm bulundu: '+release.version+' · İndirmek için güncelleme düğmesine bas.');
      if(!silent)toast('⬆️','Yeni TürkOS sürümü',release.version+' sürümü yayınlanmış.');
      return {available:true,release};
    }
    setStatus('TürkOS güncel · v'+APP_VERSION);
    if(!silent)toast('✅','TürkOS güncel','Şu anda v'+APP_VERSION+' kullanıyorsun.');
    return {available:false,release};
  }catch(error){
    setStatus('Sürüm sunucusuna ulaşılamadı. İnternet bağlantını veya yayınlanan siteyi kontrol et.');
    if(!silent)toast('⚠️','Kontrol yapılamadı','Sürüm bilgisi alınamadı.');
    return {available:false,error};
  }
}
function downloadCurrentBuild(){
  try{
    if(__tosLatestRelease&&__tosCompareVersions(__tosLatestRelease.version,APP_VERSION)>0){
      const a=document.createElement('a');a.href=new URL(__tosLatestRelease.file||'./turkos.html',document.baseURI||location.href).href;a.download='TurkOS-Bilge-Surum-'+__tosLatestRelease.version+'.html';document.body.appendChild(a);a.click();a.remove();
      toast('⬇️','Güncelleme indiriliyor','TürkOS v'+__tosLatestRelease.version+' dosyası hazırlanıyor.');return;
    }
    const html='<!DOCTYPE html>\n'+document.documentElement.outerHTML;

    const a=document.createElement('a');a.href=url;a.download='TurkOS-Bilge-Surum-'+APP_VERSION+'.html';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);

function calculateExpression(raw){
  const source=String(raw).replace(/÷/g,'/').replace(/×/g,'*').replace(/−/g,'-').replace(/\s+/g,'');
  const tokens=source.match(/(?:\d+(?:\.\d*)?|\.\d+|[()+\-*/])/g)||[];
  if(!source||tokens.join('')!==source)throw new Error('Geçersiz ifade');
  let i=0;
  const expression=()=>{let value=term();while(tokens[i]==='+'||tokens[i]==='-'){const op=tokens[i++],right=term();value=op==='+'?value+right:value-right}return value};
  const term=()=>{let value=factor();while(tokens[i]==='*'||tokens[i]==='/'){const op=tokens[i++],right=factor();if(op==='/'&&right===0)throw new Error('Sıfıra bölünemez');value=op==='*'?value*right:value/right}return value};
  const factor=()=>{if(tokens[i]==='+'){i++;return factor()}if(tokens[i]==='-'){i++;return -factor()}if(tokens[i]==='('){i++;const value=expression();if(tokens[i]!==')')throw new Error('Parantez hatası');i++;return value}const token=tokens[i++];if(token===undefined||!/^\d+(?:\.\d*)?$|^\.\d+$/.test(token))throw new Error('Sayı bekleniyordu');return Number(token)};
  const result=expression();if(i!==tokens.length||!Number.isFinite(result))throw new Error('Geçersiz sonuç');return Number(result.toFixed(10)).toString();
}

  constructor(){this.wins={};this.z=100;this.active=null}

    $('#windows').appendChild(el);

    this.wins[id]=win;
    $('.wh',el).addEventListener('pointerdown',e=>{if(!e.target.closest('.cb'))this.drag(e,win)});
    $('.rz',el).addEventListener('pointerdown',e=>this.resize(e,win));
    $('.min',el).onclick=()=>this.minimize(id);

  }
  close(id){const w=this.wins[id];if(!w)return;w.el.classList.add('closing');
    if(w.raf)cancelAnimationFrame(w.raf);w.timers.forEach(clearInterval);
    setTimeout(()=>{if(w.opts.close)w.opts.close(w);w.el.remove();delete this.wins[id];$('#tb-'+id)?.remove()},180)}
  minimize(id){const w=this.wins[id];w.el.classList.add('min');w.min=true;tbState(id,false)}

    this.focus(id)}
  focus(id){const w=this.wins[id];if(!w)return;w.el.style.zIndex=++this.z;this.active=id;
    Object.keys(this.wins).forEach(k=>tbState(k,k===id&&!this.wins[k].min))}
  drag(e,w){if(w.max)return;this.focus(w.id);this.d={w,x:e.clientX-w.el.offsetLeft,y:e.clientY-w.el.offsetTop}}
  resize(e,w){if(w.max)return;e.stopPropagation();this.focus(w.id);this.r={w,x:e.clientX,y:e.clientY,W:w.el.offsetWidth,H:w.el.offsetHeight}}
}

function mathQ(g){
  let q,a,pool=new Set();
  if(g<=2){const x=rnd(20)+1,y=rnd(20)+1;a=x+y;q=x+" + "+y+" = ?"}
  else if(g<=4){const x=rnd(9)+2,y=rnd(9)+2;a=x*y;q=x+" × "+y+" = ?"}
  else if(g<=6){if(rnd(2)){const t=rnd(9)+2,p=[10,20,25,50][rnd(4)];a=t*p/100;q=t+" sayısının %"+p+"'i kaçtır?"}else{const x=rnd(20)+5,y=rnd(12)+2;a=x*y;q=x+" × "+y+" = ?"}}
  else if(g<=8){if(rnd(2)){const x=rnd(9)+2,b=rnd(12)+1,c=rnd(9)+2;a=c;q=x+"x + "+b+" = "+(x*c+b)+" ise x = ?"}else{const n=rnd(12)+2;a=n*n;q="√"+(n*n)+" = ?"}}
  else if(g<=10){const r1=rnd(6)+1,r2=rnd(6)+1;a=r1+r2;q="x² - "+(r1+r2)+"x + "+(r1*r2)+" = 0 denkleminin kökleri toplamı kaçtır?"}
  else if(g===11){const v=[["sin 30°","0,5"],["cos 60°","0,5"],["tan 45°","1"]][rnd(3)];return[v[0]+" kaçtır?",["0,5","1","√3/2"],v[1]==="1"?1:0]}
  else{const n=rnd(4)+2;a=n*3*3;q="f(x) = x³ ise f'("+3+") kaçtır?";a=27}
  pool.add(a);while(pool.size<4)pool.add(a+(rnd(11)-5)||a+7);
  const opts=shuffle([...pool]).map(String),ans=opts.indexOf(String(a));
  return[q,opts,ans];
}
function buildQuiz(g,subj,count=10){
  let pool=(QB[g+"|"+subj]||[]).slice();
  if(!pool.length)pool=Object.keys(QB).filter(k=>k.endsWith("|"+subj)).flatMap(k=>QB[k]);
  if(subj==="Matematik"){const arr=[];for(let i=0;i<count;i++)arr.push(mathQ(+g));return arr}
  if(!pool.length)pool=QB["genel|İngilizce"];
  let out=shuffle(pool);while(out.length<count)out=out.concat(shuffle(pool));
  return out.slice(0,count);
}

A("paint","Boyama Kitabı","🖍️","kiz",600,540,(b)=>{

  const c=$("#cv",b),x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,540,340);

    if(t==="Çiçek"){for(let i=0;i<6;i++){const a=i*Math.PI/3;x.moveTo(270,150);x.ellipse(270+Math.cos(a)*45,150+Math.sin(a)*45,32,20,a,0,7)}x.moveTo(290,150);x.arc(270,150,20,0,7);x.moveTo(270,175);x.lineTo(270,300)}

  c.addEventListener("pointerdown",e=>{down=true;const[a,d]=pos(e);x.beginPath();x.moveTo(a,d)});
  c.addEventListener("pointermove",e=>{if(!down)return;const[a,d]=pos(e);x.lineTo(a,d);x.strokeStyle=er?"#fff":col;x.lineWidth=er?size*2:size;x.lineCap="round";x.stroke()});
  addEventListener("pointerup",()=>down=false);

});

/* ============ ARAYÜZ ============ */
const CATS=[["hepsi","Tümü"],["egitim","Eğitim"],["oyun","Oyunlar"],["kiz","Kızlar"],["zeka","Zeka"],["arac","Araçlar"]];
let curCat="hepsi";
function renderStart(){
  const q=$("#search").value.toLocaleLowerCase("tr");
  $("#stgrid").innerHTML="";
  APPS.filter(a=>(curCat==="hepsi"||a.cat===curCat)&&a.title.toLocaleLowerCase("tr").includes(q)).forEach(a=>{
    const d=document.createElement("div");d.className="si";d.innerHTML='<div class="i">'+a.icon+'</div><div class="t">'+a.title+'</div>';
    d.onclick=()=>{openApp(a.id);toggleStart(false)};$("#stgrid").appendChild(d)});
}
function renderDesktop(){
  $("#desktop").innerHTML="";
  APPS.filter(a=>a.desk).forEach(a=>{const d=document.createElement("div");d.className="di";d.innerHTML='<div class="ic">'+a.icon+'</div><div class="lb">'+a.title+'</div>';d.ondblclick=()=>openApp(a.id);d.onclick=()=>openApp(a.id);$("#desktop").appendChild(d)});
}
function toggleStart(f){const s=$("#start");const on=f===undefined?!s.classList.contains("on"):f;s.classList.toggle("on",on);if(on){$("#search").value="";renderStart();$("#search").focus()}}
$("#startbtn").onclick=e=>{e.stopPropagation();toggleStart()};
$("#search").oninput=renderStart;
CATS.forEach(c=>{const t=document.createElement("div");t.className="tab"+(c[0]==="hepsi"?" on":"");t.textContent=c[1];
  t.onclick=()=>{curCat=c[0];$$(".tab").forEach(x=>x.classList.remove("on"));t.classList.add("on");renderStart()};$("#sttabs").appendChild(t)});

addEventListener("click",e=>{if(!e.target.closest("#ctx"))$("#ctx").style.display="none";if(!e.target.closest("#start")&&!e.target.closest("#startbtn"))toggleStart(false);$("#ctx").style.display==="block"&&!e.target.closest("#ctx")&&($("#ctx").style.display="none")});
