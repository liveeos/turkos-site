<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#090d18">
<meta name="description" content="TürkOS resmî yayın tarihi: 16 Nisan 2027. Yeni bir dijital deneyim yakında başlıyor.">
<title>TürkOS — 16.04.2027</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
:root{color-scheme:dark;--red:#e30a17;--white:#f7f8fc;--muted:#aeb7c9;--glass:rgba(255,255,255,.07)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,"Segoe UI",system-ui,sans-serif;color:var(--white)}
body{min-height:100vh;overflow:hidden;background:radial-gradient(ellipse at 50% 38%,rgba(227,10,23,.23),transparent 42%),radial-gradient(ellipse at 12% 90%,rgba(34,85,160,.16),transparent 35%),#090d18;display:grid;place-items:center;padding:24px}
body:before,body:after{content:"";position:fixed;width:42vmax;height:42vmax;border:1px solid rgba(255,255,255,.055);border-radius:50%;pointer-events:none;animation:orbit 28s linear infinite}body:before{top:-23vmax;right:-12vmax}body:after{bottom:-30vmax;left:-15vmax;animation-direction:reverse}
.stars{position:fixed;inset:0;pointer-events:none;background-image:radial-gradient(2px 2px at 12% 20%,#ffffff66 45%,transparent 55%),radial-gradient(1px 1px at 75% 18%,#ffffff77 45%,transparent 55%),radial-gradient(2px 2px at 88% 72%,#ffffff55 45%,transparent 55%),radial-gradient(1px 1px at 26% 82%,#ffffff66 45%,transparent 55%),radial-gradient(1px 1px at 48% 10%,#ffffff55 45%,transparent 55%);opacity:.6}
.card{position:relative;width:min(760px,100%);padding:clamp(30px,6vw,66px) clamp(22px,6vw,64px);text-align:center;border:1px solid rgba(255,255,255,.13);border-radius:30px;background:linear-gradient(145deg,rgba(255,255,255,.09),rgba(255,255,255,.025));box-shadow:0 35px 110px #0009;backdrop-filter:blur(18px);animation:rise 1s ease both}
.logo{width:76px;height:76px;margin:0 auto 19px;display:grid;place-items:center;border-radius:24px;background:linear-gradient(145deg,#970711,var(--red),#ff6973);box-shadow:0 12px 42px #e30a174d;font-size:34px;animation:pulse 3s ease-in-out infinite}
.brand{font-weight:900;font-size:clamp(25px,5vw,34px);letter-spacing:.22em;margin-left:.22em}.edition{font-size:10px;letter-spacing:.34em;color:#c5cad6;margin-top:5px}
.pill{display:inline-flex;align-items:center;gap:9px;margin:34px 0 18px;padding:8px 14px;border:1px solid #ff657044;border-radius:99px;background:#e30a1715;color:#ff9ba2;font-size:11px;font-weight:800;letter-spacing:.17em}.pulse-dot{width:7px;height:7px;border-radius:50%;background:#ff6470;box-shadow:0 0 0 0 #ff647077;animation:ping 1.8s infinite}
h1{font-size:clamp(30px,6vw,55px);line-height:1.08;letter-spacing:-.045em;margin:0 0 14px}.lead{max-width:490px;margin:0 auto;color:var(--muted);font-size:clamp(14px,2.3vw,17px);line-height:1.8}
.date{margin:35px 0 9px;font-size:clamp(38px,9vw,68px);line-height:1;font-weight:850;letter-spacing:.045em;background:linear-gradient(100deg,#fff 15%,#ff8991 75%);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 8px 35px #e30a1722}.date-label{font-size:10px;letter-spacing:.3em;color:#c2c8d4;font-weight:800}
.countdown{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:470px;margin:34px auto 0}.unit{padding:15px 8px;border:1px solid rgba(255,255,255,.1);border-radius:15px;background:var(--glass)}.num{display:block;font-size:clamp(25px,5vw,36px);font-weight:800;font-variant-numeric:tabular-nums}.unit small{display:block;margin-top:3px;color:#9ea8ba;font-size:9px;letter-spacing:.15em;text-transform:uppercase}
.bottom{margin-top:31px;color:#929db0;font-size:11px;letter-spacing:.04em}.flag{display:inline-block;margin-right:6px}
@keyframes ping{70%{box-shadow:0 0 0 8px #ff647000}100%{box-shadow:0 0 0 0 #ff647000}}@keyframes pulse{50%{transform:translateY(-4px);box-shadow:0 18px 52px #e30a1766}}@keyframes orbit{to{transform:rotate(360deg)}}@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:480px){body{padding:14px}.card{border-radius:23px;padding:34px 18px}.logo{width:65px;height:65px;border-radius:20px;font-size:29px}.pill{margin-top:28px}.countdown{gap:6px}.unit{padding:12px 4px}.unit small{font-size:8px;letter-spacing:.08em}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="stars" aria-hidden="true"></div>
<main class="card">
  <div class="logo" aria-hidden="true">☾★</div>
  <div class="brand">TÜRKOS</div>
  <div class="edition">BİLGE SÜRÜM</div>
  <div class="pill"><span class="pulse-dot"></span> RESMÎ YAYIN TARİHİ BELİRLENDİ</div>
  <h1>Yeni bir deneyime<br>hazır ol.</h1>
  <p class="lead">TürkOS çok yakında kapılarını açıyor. Bizi bekleyen yeni dijital dünyayı keşfetmek için geri sayım başladı.</p>
  <div class="date">16.04.2027</div>
  <div class="date-label">CUMA · TÜRKOS LANSMANI</div>
  <div class="countdown" aria-label="Yayın tarihine kalan süre">
    <div class="unit"><span class="num" id="days">—</span><small>Gün</small></div>
    <div class="unit"><span class="num" id="hours">—</span><small>Saat</small></div>
    <div class="unit"><span class="num" id="minutes">—</span><small>Dakika</small></div>
    <div class="unit"><span class="num" id="seconds">—</span><small>Saniye</small></div>
  </div>
  <div class="bottom"><span class="flag">🇹🇷</span>Türkiye için tasarlandı · TürkOS ekibi</div>
</main>
<script>
(()=>{
  // 16 Nisan 2027, 00:00 — Türkiye saati (UTC+3)
  const launch = new Date('2027-04-16T00:00:00+03:00').getTime();
  const ids = ['days','hours','minutes','seconds'];
  function tick(){
    const left = launch - Date.now();
    if(left <= 0){
      // Lansman günü geldiğinde ana sayfa otomatik olarak TürkOS uygulamasını açar.
      location.replace('./turkos.html');
      return;
    }
    const values=[Math.floor(left/86400000),Math.floor(left/3600000)%24,Math.floor(left/60000)%60,Math.floor(left/1000)%60];
    ids.forEach((id,i)=>document.getElementById(id).textContent=String(values[i]).padStart(2,'0'));
  }
  tick(); setInterval(tick,1000);
})();
</script>
</body>
</html>
